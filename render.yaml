services:
  - type: web
    name: attendance-test-isolated
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: MASTER_SYNC_ENABLED
        value: "true"
      - key: MASTER_SYNC_PROVIDER
        value: google_drive
      - key: MASTER_SYNC_INTERVAL_MINUTES
        value: "10"
      - key: MASTER_SYNC_ON_STARTUP
        value: "true"
      - key: MASTER_SYNC_MAX_MB
        value: "20"
      - key: GOOGLE_DRIVE_FILE_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: LINE_MODE
        value: live
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LIFF_ID
        sync: false
      - key: DATABASE_URL
        sync: false
