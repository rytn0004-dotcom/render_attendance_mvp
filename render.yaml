services:
  - type: web
    name: attendance-test-isolated
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-test-db
          property: connectionString
      - key: LINE_MODE
        value: simulation
      - key: LATE_GRACE_MINUTES
        value: "10"
      - key: CHECKOUT_GRACE_MINUTES
        value: "15"
      - key: CHECKIN_EARLY_MINUTES
        value: "60"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false
      - key: PUBLIC_BASE_URL
        value: ""

databases:
  - name: attendance-test-db
    plan: free
    region: singapore
