services:
  - type: web
    name: render-attendance-mvp
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LINE_MODE
        value: live
      - key: LATE_GRACE_MINUTES
        value: "10"
      - key: CHECKOUT_GRACE_MINUTES
        value: "15"
      - key: CHECKIN_EARLY_MINUTES
        value: "60"
      - key: BINDING_LINK_MINUTES
        value: "60"
      - key: NOTIFICATION_RETRY_COOLDOWN_MINUTES
        value: "15"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: LIFF_ID
        sync: false
      - key: PUBLIC_BASE_URL
        value: ""
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
